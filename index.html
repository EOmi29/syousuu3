<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>しょうすうのまど</title>
<style>
:root{--bg:#fff7ea;--card:#fffdf8;--ink:#5b4632;--o:#ff9a62;--g:#6fcf97;--p:#ffe0d0;--y:#fff0b8;--line:#e6cda9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2019;--card:#3a2d23;--ink:#fbeedd;--p:#5c3b2c;--y:#6a5726;--line:#6d5641}}
:root[data-theme="dark"]{--bg:#2a2019;--card:#3a2d23;--ink:#fbeedd;--p:#5c3b2c;--y:#6a5726;--line:#6d5641}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic","BIZ UDPGothic","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
#app,.col{height:100%}
.col{--W:66px;--P:30px;--H:clamp(48px,8vh,68px);display:flex;flex-direction:column;padding:10px 20px 14px;box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{margin:0;font-size:clamp(22px,3.6vh,30px)}h2{margin:0 0 10px;font-size:24px}
.btn{border:0;border-radius:999px;padding:11px 24px;font:inherit;font-size:19px;font-weight:700;background:var(--o);color:#fff;box-shadow:0 4px 0 #d9783f;cursor:pointer}
.btn.s{background:var(--g);box-shadow:0 4px 0 #46a671}
.btn.w{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.w.on{background:var(--o);color:#fff;border-color:var(--o)}
.btn:active{transform:translateY(3px);box-shadow:none}
.card{background:var(--card);border-radius:22px;box-shadow:0 3px 0 var(--line),0 8px 20px #0001;padding:16px;box-sizing:border-box}
.home{flex:1;display:flex;gap:24px;align-items:center;justify-content:center}
.hb{width:250px;height:290px;border:0;border-radius:28px;font:inherit;font-size:23px;font-weight:700;color:var(--ink);background:var(--card);box-shadow:0 6px 0 var(--line);cursor:pointer;line-height:1.5;padding:12px}
.hb i{display:block;font-style:normal;font-size:70px}.hb small{font-size:15px;font-weight:400;display:block;opacity:.8}
.row,.work{flex:1;min-height:0;display:flex;gap:18px}
.side{width:230px;display:flex;flex-direction:column;align-items:center;gap:12px}
.tip{margin:0;font-size:17px;line-height:1.6;text-align:center}
.srcs{display:flex;gap:22px;align-items:flex-end;padding:6px}
.it{display:inline-flex;flex-direction:column;align-items:center;touch-action:none}
.pc{position:relative;overflow:hidden;clip-path:polygon(50% 100%,0 5%,50% 0,100% 5%)}.pc img{position:absolute;top:0}
.lb{font-size:22px;font-weight:700;margin-top:2px;min-height:4px}
.src,.box .it{cursor:grab}
.box{flex:1;position:relative;border:4px dashed var(--o);border-radius:24px;background:var(--card)}
.tot{position:absolute;right:22px;top:12px;font-size:30px;font-weight:700}.tot b{font-size:64px;color:var(--o)}
.bh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.5;pointer-events:none}
.ov{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:20}
.mc{background:var(--card);border-radius:28px;padding:24px 34px;text-align:center;max-width:90vw}
.dm{display:flex;align-items:center;gap:22px;justify-content:center}.arr{font-size:50px;color:var(--o)}
.ps{display:grid;grid-template-columns:repeat(5,auto);gap:10px 16px}
.ql{flex:1;text-align:center}.pz{display:flex;flex-direction:column;align-items:center;gap:14px;margin:10px 0}
.pw,.pr{display:flex;gap:14px;align-items:flex-end}.pr{gap:10px}
.wd{position:absolute;transform-origin:50% 100%;transition:transform .5s ease}
.stg{position:relative;margin:0 auto}.stz{position:absolute;transition:opacity .4s}
.wl{position:absolute;left:0;top:0;font-size:26px;font-weight:900;color:#fff;-webkit-text-stroke:6px #7a3b12;paint-order:stroke fill;opacity:0;pointer-events:none;white-space:nowrap;transition:transform .5s,opacity .3s}
.cnt{font-size:32px;font-weight:700;min-height:46px}.cnt b{color:var(--o);font-size:44px}
.pop{animation:pp .5s}
.rb{position:relative;width:540px;margin:0 auto}
.ob{height:44px;border-radius:10px;display:flex;align-items:center;padding-left:10px;box-sizing:border-box;font-size:26px;white-space:nowrap;overflow:hidden;margin-bottom:8px;color:#5b4632}
.rl{position:relative;height:66px;width:540px;background:var(--y);border-radius:6px}
.tk{position:absolute;top:0;width:2px;height:16px;background:var(--ink);margin-left:-1px}.tk.mid{height:26px}.tk.big{height:36px}
.nm{position:absolute;top:38px;transform:translateX(-50%);font-size:20px;font-weight:700;font-style:normal}
.eg{position:absolute;top:0;bottom:0;width:2px;background:#e0507a;opacity:.55;margin-left:-1px}
.bk{position:relative;height:40px;margin:8px auto 0;width:540px}
.bl{position:absolute;top:0;height:36px;background:var(--g);border-radius:6px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;animation:pp .35s}
.rm{position:absolute;top:0;height:118px;outline:3px dashed var(--o);border-radius:4px}
.zm{width:540px;margin:14px auto 0;visibility:hidden}
.zh{display:flex;justify-content:space-between;font-weight:700;font-size:20px;margin-bottom:4px}
.zb{position:relative;height:64px;border:3px solid var(--o);border-radius:8px;box-sizing:border-box;overflow:hidden}
.zf{position:absolute;left:0;top:0;bottom:0}
.zl{position:absolute;top:0;width:3px;height:0;background:var(--ink);margin-left:-1.5px;transition:height .25s}
.zt{position:absolute;top:0;bottom:0;width:10%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;-webkit-text-stroke:4px #7a3b12;paint-order:stroke fill;animation:pp .3s}

.tst{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:14px 28px;border-radius:999px;font-size:22px;font-weight:700;z-index:60}
.qr{width:330px;display:flex;flex-direction:column;gap:10px}
.al{font-size:18px}.abox{height:68px;border:3px solid var(--o);border-radius:16px;font-size:46px;font-weight:700;text-align:center;line-height:68px;background:var(--card)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{font:inherit;font-size:28px;font-weight:700;height:clamp(46px,8vh,62px);border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.key:active{background:var(--p)}
.ent{grid-column:1/-1}
.left{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0}
.ex{display:flex;align-items:center;gap:12px;font-size:40px;font-weight:700}
.chip{display:flex;align-items:center;height:var(--H);padding:0 5px;border-radius:14px;background:var(--y);font-size:42px;font-weight:700;cursor:grab;touch-action:none;box-shadow:0 3px 0 var(--line)}
.chip .d{width:var(--W);text-align:center}.chip .p{width:var(--P);text-align:center}.chip .f{opacity:0}.hn .chip .f{opacity:1;color:#e0507a}.chip .x{display:none}.chip .z{opacity:.3}.hn .chip .x{display:block}.sm{padding:6px 16px;font-size:16px}
.hint{font-size:19px;min-height:28px;text-align:center}.hint.ok{color:#2f9e5f;font-weight:700}.hint.bad{color:#d9622b;font-weight:700}
.paper{position:relative;padding:12px 26px 22px 12px;background:var(--card);border-radius:20px;box-shadow:0 3px 0 var(--line),0 8px 20px #0001}
.gr{display:grid;grid-template-columns:repeat(3,var(--W)) var(--P) var(--W)}
.cl{height:var(--H);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;box-sizing:border-box}
.cl.hd{height:34px;color:var(--o);font-size:26px}
.sl{border:2px dashed var(--line)}.pt{background:var(--p)}
.ln{grid-column:1/-1;height:6px;background:var(--ink);border-radius:3px;margin:3px 0}
.drop{color:#e0507a;font-size:60px;animation:bn .7s infinite alternate}
@keyframes bn{to{transform:translateY(8px)}}
.memo{position:absolute;inset:0;z-index:5;width:100%;height:100%;pointer-events:none;touch-action:none}
.right{width:330px;display:flex;flex-direction:column;gap:10px}
.tools{display:flex;gap:8px}.tools .btn{flex:1;padding:9px 6px;font-size:16px}
.st{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:260px;font-weight:900;pointer-events:none;z-index:50;animation:pp .4s}
.st.ok{color:#f0567a}.st.ng{color:#5b86d8}
@keyframes pp{from{transform:scale(.3);opacity:0}}
.set{align-self:center;display:flex;flex-direction:column;gap:20px;padding:26px 34px}
.srow{display:flex;align-items:center;gap:12px}.srow b{width:220px;font-size:21px}
.fin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-size:40px;font-weight:700}
.sty{width:min(980px,96vw);height:min(96vh,720px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;padding:18px 24px;box-sizing:border-box;cursor:pointer}
.sty h2{min-height:4.1em;font-size:clamp(22px,4.2vh,34px);line-height:1.35;margin:0;text-align:center}
.sty h2 b{color:var(--o);font-size:1.25em}
.sty .cnt{font-size:clamp(22px,4vh,32px)}
.zw{position:absolute;transform-origin:50% 50%;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.ft{min-height:64px;display:flex;align-items:center;justify-content:center}
.nx{font-size:22px;font-weight:700;color:var(--o);opacity:0;animation:nxb 1s infinite alternate}.nx.on{opacity:1}
@keyframes nxb{to{transform:translateX(8px)}}
.xb{position:absolute;right:16px;top:14px;z-index:3}
</style></head><body><div id="app"></div>
